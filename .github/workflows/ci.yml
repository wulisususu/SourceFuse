name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MOONBIT_VERSION: 0.10.14+7d59c7ec9

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 3 -fsSL \
            https://cli.moonbitlang.com/install/unix.sh \
            | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          $env:MOONBIT_INSTALL_VERSION = $env:MOONBIT_VERSION
          $script = Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1
          Invoke-Expression $script
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check native
        run: moon check --target native --deny-warn

      - name: Test native
        run: moon test --target native

      - name: Build native
        run: moon build --target native

      - name: Smoke test reference CLI examples
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          def run(path):
              result = subprocess.run(
                  ["moon", "run", "cmd/sourcefuse", path],
                  check=True,
                  text=True,
                  capture_output=True,
              )
              return json.loads(result.stdout)

          human = run("examples/human-ocr-model/record.json")
          field = human["fields"][0]
          assert field["value"] == "张珊"
          assert field["supporter_count"] == 2
          assert [item["source_id"] for item in field["supporters"]] == ["operator", "ocr"]

          authority = run("examples/device-human-model/record.json")
          field = authority["fields"][0]
          assert field["value"] == "320102199901011234"
          assert any(
              step["rule"] == "source_authority_override_applied"
              for step in field["trace"]
          )

          conflict = run("examples/conflicted-record/record.json")
          assert conflict["summary"] == {
              "declared_fields": 3,
              "resolved_fields": 2,
              "conflicted_fields": 1,
          }
          phone = next(item for item in conflict["fields"] if item["name"] == "phone")
          assert phone["conflict"] == "equal_priority_conflict"
          PY

  cross-target:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        shell: bash
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 3 -fsSL \
            https://cli.moonbitlang.com/install/unix.sh \
            | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check all portable targets
        run: moon check --target all --deny-warn

      - name: Test all portable targets
        run: moon test --target all

      - name: Build all portable targets
        run: moon build --target all

      - name: Enforce core dependency boundary
        shell: bash
        run: |
          if grep -R -n -E 'moonbitlang/core/json|wulisususu/sourcefuse/wire' core --include='*.mbt' --include='moon.pkg'; then
            echo "core/ must not depend on JSON or wire adapters"
            exit 1
          fi

      - name: Validate package file set
        shell: bash
        run: |
          moon package --list | tee /tmp/sourcefuse-package-files.txt
          if grep -E '(^|/)(target|tmp|\.temp)/|\.log$|\.env($|\.)' /tmp/sourcefuse-package-files.txt; then
            echo "package contains generated or local-only files"
            exit 1
          fi

      - name: Validate release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          manifest = pathlib.Path("moon.mod").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', manifest, re.MULTILINE)
          assert match, "moon.mod version is missing"
          version = match.group(1)

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          assert f"## [{version}]" in changelog, f"CHANGELOG missing {version}"

          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          assert f"v{version}" in readme, f"README missing v{version}"
          PY

      - name: Generate and guard public API
        shell: bash
        run: |
          moon info --target native
          python3 - <<'PY'
          from pathlib import Path

          core = Path("core/pkg.generated.mbti").read_text(encoding="utf-8")
          wire = Path("wire/pkg.generated.mbti").read_text(encoding="utf-8")

          required_core = [
              "pub fn candidate(",
              "pub fn default_policy(",
              "pub fn policy(",
              "pub fn reconcile(",
              "pub fn reconcile_with_policy(",
              "pub fn reconcile_record(",
              "pub fn decision_report(",
          ]
          required_wire = [
              "pub const RECORD_SCHEMA",
              "pub const DECISION_REPORT_SCHEMA",
              "pub fn parse_record_document(",
              "pub fn decision_report_json(",
              "pub fn reconcile_record_json(",
          ]

          for symbol in required_core:
              assert symbol in core, f"core public API missing: {symbol}"
          for symbol in required_wire:
              assert symbol in wire, f"wire public API missing: {symbol}"
          PY
