name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MOONBIT_VERSION: 0.10.14+7d59c7ec9

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 3 -fsSL \
            https://cli.moonbitlang.com/install/unix.sh \
            | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          $env:MOONBIT_INSTALL_VERSION = $env:MOONBIT_VERSION
          $script = Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1
          Invoke-Expression $script
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check native
        run: moon check --target native --deny-warn

      - name: Test native
        run: moon test --target native

      - name: Build native
        run: moon build --target native

  cross-target:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        shell: bash
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 3 -fsSL \
            https://cli.moonbitlang.com/install/unix.sh \
            | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check all portable targets
        run: moon check --target all --deny-warn

      - name: Test all portable targets
        run: moon test --target all

      - name: Build all portable targets
        run: moon build --target all

      - name: Enforce core dependency boundary
        shell: bash
        run: |
          if grep -R -n -E 'moonbitlang/core/json|wulisususu/sourcefuse/wire' core --include='*.mbt' --include='moon.pkg'; then
            echo "core/ must not depend on JSON or wire adapters"
            exit 1
          fi

      - name: Validate package
        run: moon package --list
